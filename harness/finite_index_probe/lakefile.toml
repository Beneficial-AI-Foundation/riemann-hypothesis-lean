name = "finiteIndexProbe"
defaultTargets = ["ProbeTarget"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
pp.unicode.fun = true
maxHeartbeats = 4000000

[[require]]
name = "tree"
path = "../.."

[[require]]
name = "mathlib"
path = "../../.lake/packages/mathlib"

[[require]]
name = "plausible"
path = "../../.lake/packages/plausible"

[[require]]
name = "LeanSearchClient"
path = "../../.lake/packages/LeanSearchClient"

[[require]]
name = "importGraph"
path = "../../.lake/packages/importGraph"

[[require]]
name = "proofwidgets"
path = "../../.lake/packages/proofwidgets"

[[require]]
name = "aesop"
path = "../../.lake/packages/aesop"

[[require]]
name = "Qq"
path = "../../.lake/packages/Qq"

[[require]]
name = "batteries"
path = "../../.lake/packages/batteries"

[[require]]
name = "Cli"
path = "../../.lake/packages/Cli"

[[lean_lib]]
name = "ProbeTarget"
roots = ["ProbeTarget"]
